# Бланки контрактов и координаты полей.
#
# box: [x, y, ширина, высота] — прямоугольник в пикселях на картинке.
# Текст автоматически переносится, центрируется и уменьшается, чтобы влезть.
# После правки запусти:  python generate_samples.py --debug-boxes
#
# Шрифты можно указывать алиасом из блока fonts или путём к .ttf/.otf.
# Шрифт подписи задаётся в defaults.font и может переопределяться в поле.

fonts:
  handwriting: assets/fonts/Caveat-Variable.ttf
  comic: assets/fonts/Neucha.ttf
  serif: assets/fonts/PTSerif-Regular.ttf
  serif_bold: assets/fonts/PTSerif-Bold.ttf
  display: assets/fonts/Oswald-Variable.ttf
  emoji: assets/fonts/NotoEmoji-Variable.ttf

  # Comic Neue — свободная замена Comic Sans (кириллица есть).
  comic_sans: assets/fonts/ComicNeue-Regular.ttf
  # Настоящий Comic Sans MS проприетарный, в репозиторий не входит.
  # Положи свой файл в assets/fonts/ComicSansMS.ttf и замени строку выше на:
  # comic_sans: assets/fonts/ComicSansMS.ttf

defaults:
  font: handwriting
  emoji_font: emoji
  font_size: 58
  color: "#1b2a4a"
  align: center          # left | center | right
  valign: middle         # top | middle | bottom
  max_length: 32
  max_lines: 2
  min_font_scale: 0.6
  line_spacing: 1.05

templates:
