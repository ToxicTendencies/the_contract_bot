    file: templates/classic.png
    title: "Классический договор"
    description: "Строгий бланк · две подписи"
    tags: ["классика", "строгий", "договор"]
    keywords: ["услуги", "официальный", "серьёзный", "работа"]
    fields:
      party1:
        label: "Сторона 1"
        sample: "Иванов И.И."
        box: [78, 1280, 500, 140]
      party2:
        label: "Сторона 2"
        sample: "Петров П.П."
        box: [662, 1280, 500, 140]
    self_sign_note:
      box: [78, 1488, 1084, 72]
