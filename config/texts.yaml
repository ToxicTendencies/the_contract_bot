# Все тексты бота. Меняй свободно, перезапуск не нужен:
# файл перечитывается на лету (в течение секунды после сохранения).
#
# Плейсхолдеры в фигурных скобках подставляются автоматически.
# Если убрать плейсхолдер — ничего не сломается.
#
# {bot}      — username бота
# {title}    — название бланка
# {label}    — название стороны («Сторона 1» и т.п.)
# {link}     — ссылка на профиль подписанта (в archive.signer_line)
# {signers}  — готовый список подписантов
# {terms}    — свободные условия контракта
# {max_length}, {length}, {remaining}, {count}, {active}, {pending}

dm:
  greeting: |
    Привет! Я собираю контракты прямо в чатах — личка для подписи не нужна.

    Как подписать:
    1. В любом чате набери @{bot} — появится бланк.
       Можно сразу с уточнением: @{bot} средневековый
    2. Нажми кнопку своей стороны прямо в чате.
    3. Ответь на моё сообщение своим текстом — это и будет подпись.
    4. Когда подпишут все стороны, картинка в чате обновится.

    Свободные условия: @{bot} условия — я попрошу текст и напечатаю его
    на бланке, а потом соберу подписи.

    Я не вижу историю чата: только сообщение с упоминанием и ответы на мои сообщения.

    Команды:
    /help — помощь
    /templates — список бланков
    /status — состояние бота (владелец)
    /debug — последние события и живые контракты (владелец)
    /reload — перечитать настройки (владелец)

    Подписанные копии со ссылками на подписантов приходят в этот чат.

  help: |
    Как подписать контракт:
    • В любом чате набери @{bot} — появится бланк.
    • Можно выбрать словами: @{bot} средневековый, @{bot} минимализм.
    • Нажми кнопку своей стороны и ответь на сообщение бота своим текстом.
    • Подпись — до {max_length} символов, эмодзи можно.
    • Обе стороны может подписать один человек — тогда на картинке появится пометка.
    • Подписывать может любой участник чата, а не только автор сообщения.
    • Каждое сообщение с бланком живёт само по себе; новое не ломает старое.
    • Контракт живёт {ttl_minutes} минут с последнего действия.

    Свободные условия:
    • @{bot} условия — бот попросит текст условий и напечатает его на бланке.
    • Условия — до {terms_max} символов, потом подписи как обычно.

    Новый контракт в том же чате: @{bot} новый — прежний бланк забудется.

    Ограничения Telegram:
    • Я не вижу историю чата и список участников.
    • В секретных чатах и группах с защитой контента от меня нельзя вызвать бота.

  owner_only: "Эта команда только для владельца бота."
  guest_mode_disabled: |
    ℹ️ Guest Mode выключен.

    В чатах, где бот не участник, упоминание @{bot} он не увидит.
    Добавь бота в группу — и он будет отвечать там как обычный участник.
    Либо включи Guest Mode: @BotFather → Bot Settings → Guest Mode.
  started: |
    ✅ Бот запущен.
    Бланков загружено: {count}.
    Guest Mode: {guest_mode}.
  warmup_partial: |
    ⚠️ Не все бланки загрузились: {ok} из {total}.
    Проверь, что бот не заблокирован и что файлы на месте. Подробности в логах.
  storage_failed: |
    ❌ Не удалось загрузить бланки в этот чат.
    Напиши /start ещё раз и проверь, что бот не заблокирован.
  templates_ok: |
    Бланки:
    {list}
  no_templates: "Нет доступных бланков. Проверь config/templates.yaml и папку templates/."
  template_line: "• {title} ({key}) — {status}"
  template_status_ready: "загружен"
  template_status_missing: "не загружен"
  reloaded: "✅ Настройки перечитаны. Бланков: {count}. Изменённые бланки перезалиты."
  reload_failed: "❌ Не удалось перечитать настройки: {error}"
  status: |
    Статус:
    • Guest Mode: {guest_mode}
    • Бланков: {count}
    • Активных контрактов: {active}
    • Ожидают подпись: {pending}
    • Аптайм: {uptime}
  unknown_dm: |
    Я работаю в чатах через упоминание. Напиши @{bot} в нужном чате.
  nothing_pending: |
    Здесь я только для команд и архива.
    Найди бланк через @{bot} в любом чате и нажми кнопку стороны.
  debug: |
    🔧 Отладка

    Контракты: {active}, ожиданий ввода: {pending}

    {contracts}

    Последние события:
    {events}
  debug_empty: "—"

guest:
  preview_caption: |
    {title}
    {description}

    Бланк {index} из {total}. Листай ◀ ▶ и нажми «Выбрать».
  preview_caption_no_description: |
    {title}

    Бланк {index} из {total}. Листай ◀ ▶ и нажми «Выбрать».
  contract_caption: |
    📄 {title}

    Нажми кнопку своей стороны, а затем ответь на это сообщение своим текстом.
    До {max_length} символов, эмодзи можно.
  terms_prompt: |
    📝 {title}

    Ответь на это сообщение условиями — одним сообщением, до {max_length} символов.
    Я напечатаю их на бланке, а потом останется поставить подписи.
  sign_prompt: |
    ✍️ {label}

    {user}, ответь на это сообщение своей подписью.
    До {max_length} символов, можно эмодзи.
  sign_prompt_anonymous: |
    ✍️ {label}

    Ответь на это сообщение своей подписью.
    До {max_length} символов, можно эмодзи.
  one_signed: |
    ✅ {label} подписана.

    Осталось: {remaining}.
  done_caption: |
    ✅ Подписано
    {title}
  done_self_caption: |
    ✅ Подписано
    {title}

    {note}
  self_sign_note: "принято в одностороннем порядке"
  self_sign_note_caption: "Обе подписи поставил один участник."
  sign_saved: |
    ✅ Записал подпись для «{label}».
    Осталось: {remaining}.
  sign_complete: "✅ Готово! Контракт подписан, картинка в чате обновлена."
  too_long: "Слишком длинно: {length} из {max_length} символов. Сократи подпись."
  empty: "Пустая подпись. Напиши текст."
  does_not_fit: "Подпись не помещается в поле. Сократи её или выбери другой бланк."
  text_only: "Нужен текст. Ответь на сообщение бота обычным текстовым сообщением."
  no_commands: "Похоже на команду. Пришли просто текст подписи, без /."
  not_pending: |
    Сначала нажми кнопку стороны под контрактом, потом ответь на сообщение бота.
  pending_elsewhere: |
    Подпись уже начата в другом чате. Ответь на сообщение бота там —
    или нажми кнопку стороны здесь, чтобы подписать этот контракт.
  pending_other: "Сейчас подписывает другой участник. Подожди немного."
  terms_empty: "Пустые условия. Пришли текст условий."
  terms_too_long: "Условия длинноваты: {length} из {max_length} символов. Сократи."
  terms_does_not_fit: "Условия не помещаются на бланк. Сократи текст или выбери другой бланк."
  terms_not_yours: "Условия заполняет тот, кто вызвал бота."
  unknown_query: |
    Не понял запрос «{query}».
    Доступные бланки: {templates}.
    Напиши @{bot} без текста, чтобы полистать все.
  already_signed: "«{label}» уже подписана."
  render_failed: "Не получилось собрать картинку. Попробуй ещё раз или выбери другой бланк."
  upload_failed: "Подписи сохранены, но не удалось отправить картинку. Попробуй ещё раз."
  contract_expired: "Контракт истёк. Вызови бота заново: @{bot}"
  continued: |
    ↩️ Этот контракт продолжен в новом сообщении ниже.
  no_templates: "Бланки временно недоступны. Попробуй позже."
  help: |
    Я подписываю контракты прямо в чате.
    Напиши @{bot} — появится бланк. Дальше выбери сторону и ответь на моё сообщение подписью.
    Свободные условия: @{bot} условия — пришли текст, я напечатаю его на бланке.
    Лимит подписи: {max_length} символов, эмодзи можно. Контракт живёт {ttl_minutes} минут.

