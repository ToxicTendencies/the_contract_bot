  contract_expired: "Контракт истёк. Вызови бота заново: @{bot}"
  no_templates: "Бланки временно недоступны. Попробуй позже."
  help: |
    Я подписываю контракты прямо в чате.
    Напиши @{bot} — появятся бланки. Дальше выбери сторону и ответь на моё сообщение подписью.
    Лимит: {max_length} символов, эмодзи можно. Контракт живёт {ttl_minutes} минут.

